name: Build

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    input:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual run'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      working-directory: .\dev\tests
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config=Release

    # - name: Execute Test
